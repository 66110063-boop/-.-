<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลการศึกษา | สมัครเรียน มจพ. ปราจีนบุรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-auth="1" data-nav="programs.html" data-step="2">
<div id="header"></div>

<main id="main">
  <form class="narrow page stack" id="form" novalidate>
    <div>
      <h1 class="page-title">สมัครเรียน</h1>
      <div class="apply-for" id="applyFor"></div>
      <ol class="stepper" id="stepper"></ol>
    </div>

    <section class="card">
      <div>
        <h2 class="card-title">ข้อมูลการศึกษา</h2>
        <p class="hint">วุฒิล่าสุดที่ใช้สมัคร</p>
      </div>
      <div class="field">
        <span class="label">สถานะ <span class="req">*</span></span>
        <div class="radios">
          <label class="radio"><input type="radio" name="st" data-k="e_state" value="กำลังศึกษาอยู่"> กำลังศึกษาอยู่</label>
          <label class="radio"><input type="radio" name="st" data-k="e_state" value="จบการศึกษาแล้ว"> จบการศึกษาแล้ว</label>
        </div>
      </div>
      <div class="fields">
        <div class="field"><label for="a">ระดับการศึกษา <span class="req">*</span></label><select id="a" data-k="e_level" required><option>มัธยมศึกษาปีที่ 6 (สายวิทย์-คณิต)</option><option>มัธยมศึกษาปีที่ 6 (สายศิลป์)</option><option>ประกาศนียบัตรวิชาชีพ (ปวช.)</option><option>ประกาศนียบัตรวิชาชีพชั้นสูง (ปวส.)</option></select></div>
        <div class="field"><label for="b">แผนการเรียน / สาขา <span class="req">*</span></label><input id="b" data-k="e_plan" required></div>
        <div class="field full"><label for="c">ชื่อสถานศึกษา <span class="req">*</span></label><input id="c" data-k="e_school" required></div>
        <div class="field"><label for="d">เกรดเฉลี่ยสะสม (GPAX) <span class="req">*</span></label><input id="d" data-k="gpax" inputmode="decimal" required><p class="help">ถ้ายังเรียนอยู่ ใช้เกรดเฉลี่ยถึงภาคเรียนล่าสุด</p></div>
        <div class="field"><label for="e">ปีที่จบ / คาดว่าจะจบ</label><select id="e" data-k="grad"><option>2569</option><option>2570</option></select></div>
      </div>
    </section>

    <details class="more">
      <summary>คะแนนสอบภาษาอังกฤษ <span class="opt">(ถ้ามี)</span></summary>
      <div class="fields">
        <div class="field"><label for="f">ประเภทการสอบ</label><select id="f" data-k="l_type"><option>ไม่มี</option><option>TOEIC</option><option>IELTS</option><option>TOEFL</option></select></div>
        <div class="field"><label for="g">คะแนน</label><input id="g" data-k="l_score"></div>
      </div>
    </details>
    <details class="more">
      <summary>ความสามารถพิเศษ / ผลงาน <span class="opt">(ถ้ามี)</span></summary>
      <div class="field"><label for="h">รายละเอียด</label><textarea id="h" data-k="talent" placeholder="เช่น รางวัลการแข่งขันหุ่นยนต์ระดับจังหวัด"></textarea></div>
    </details>
  </form>

  <div class="form-bar">
    <div class="narrow">
      <a class="btn btn-outline" href="profile-2.html">← ย้อนกลับ</a>
      <span class="saved">บันทึกอัตโนมัติแล้ว</span>
      <span class="spacer"></span>
      <button class="btn btn-primary btn-lg" type="submit" form="form">ถัดไป: รอบและเอกสาร →</button>
    </div>
  </div>
</main>

<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/mock.js"></script>
<script>
  const form = document.getElementById("form");
  fillForm(form);
  form.addEventListener("input", () => Store.saveProfile(readForm(form)));
  form.addEventListener("submit", e => {
    e.preventDefault();
    if(!checkRequired(form)) return;
    /* profile complete: next applications skip steps 1-3 */
    Store.saveProfile(Object.assign(readForm(form), { done:true }));
    location.href = "apply.html";
  });
</script>
</body>
</html>
