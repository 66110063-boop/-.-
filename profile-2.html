<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ช่องทางติดต่อ | สมัครเรียน มจพ. ปราจีนบุรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-auth="1" data-nav="programs.html" data-step="1">
<div id="header"></div>

<main id="main">
  <form class="narrow page stack" id="form" novalidate>
    <div>
      <h1 class="page-title">สมัครเรียน</h1>
      <div class="apply-for" id="applyFor"></div>
      <ol class="stepper" id="stepper"></ol>
    </div>

    <section class="card">
      <div>
        <h2 class="card-title">ช่องทางการติดต่อ</h2>
        <p class="hint">เราจะแจ้งผลการสมัครทางอีเมลและเบอร์โทรนี้</p>
      </div>
      <div class="fields">
        <div class="field"><label for="a">อีเมล <span class="req">*</span></label><input id="a" type="email" data-k="email" required></div>
        <div class="field"><label for="b">เบอร์มือถือ <span class="req">*</span></label><input id="b" type="tel" data-k="phone" required></div>
        <div class="field full"><label for="c">ที่อยู่ปัจจุบัน <span class="req">*</span></label><textarea id="c" data-k="address" required></textarea></div>
        <div class="field"><label for="d">จังหวัด <span class="req">*</span></label><input id="d" data-k="province" required></div>
        <div class="field"><label for="e">รหัสไปรษณีย์ <span class="req">*</span></label><input id="e" data-k="zip" inputmode="numeric" required></div>
      </div>
    </section>

    <section class="card">
      <div>
        <h2 class="card-title">ผู้ปกครองที่ติดต่อได้</h2>
        <p class="hint">บุคคลที่เราติดต่อได้ในกรณีจำเป็น</p>
      </div>
      <div class="field">
        <span class="label">ความสัมพันธ์ <span class="req">*</span></span>
        <div class="radios">
          <label class="radio"><input type="radio" name="rel" data-k="g_rel" value="บิดา"> บิดา</label>
          <label class="radio"><input type="radio" name="rel" data-k="g_rel" value="มารดา"> มารดา</label>
          <label class="radio"><input type="radio" name="rel" data-k="g_rel" value="อื่น ๆ"> อื่น ๆ</label>
        </div>
      </div>
      <div class="fields">
        <div class="field"><label for="f">ชื่อ-นามสกุล <span class="req">*</span></label><input id="f" data-k="g_name" required></div>
        <div class="field"><label for="g">เบอร์มือถือ <span class="req">*</span></label><input id="g" type="tel" data-k="g_phone" required></div>
      </div>
      <label class="check"><input type="checkbox" data-k="g_same"> ที่อยู่เดียวกับผู้สมัคร</label>
    </section>

    <details class="more">
      <summary>ข้อมูลบิดา-มารดาเพิ่มเติม <span class="opt">(ไม่บังคับ)</span></summary>
      <div class="fields">
        <div class="field"><label for="h">ชื่อ-นามสกุล บิดา</label><input id="h" data-k="f_name"></div>
        <div class="field"><label for="i">เบอร์โทร บิดา</label><input id="i" type="tel" data-k="f_phone"></div>
        <div class="field"><label for="j">ชื่อ-นามสกุล มารดา</label><input id="j" data-k="m_name"></div>
        <div class="field"><label for="k">เบอร์โทร มารดา</label><input id="k" type="tel" data-k="m_phone"></div>
      </div>
    </details>
  </form>

  <div class="form-bar">
    <div class="narrow">
      <a class="btn btn-outline" href="profile-1.html">← ย้อนกลับ</a>
      <span class="saved">บันทึกอัตโนมัติแล้ว</span>
      <span class="spacer"></span>
      <button class="btn btn-primary btn-lg" type="submit" form="form">ถัดไป: การศึกษา →</button>
    </div>
  </div>
</main>

<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/mock.js"></script>
<script>
  const form = document.getElementById("form");
  fillForm(form);
  form.addEventListener("input", () => Store.saveProfile(readForm(form)));
  form.addEventListener("submit", e => {
    e.preventDefault();
    if(!checkRequired(form)) return;
    Store.saveProfile(readForm(form));
    location.href = "profile-3.html";
  });
</script>
</body>
</html>
