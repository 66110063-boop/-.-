<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | รับสมัครนักศึกษา มจพ. ปราจีนบุรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="login" id="main">
  <div class="login-photo">
    <img src="assets/photos/building2.jpg" alt="">
    <a class="brand" href="index.html" aria-label="กลับหน้าแรก">
      <span class="brand-flag"></span>
      <span class="brand-mark">KMUT<span class="nb">NB</span></span>
    </a>
    <div class="quote">ก้าวแรกสู่การเป็นนักนวัตกรรม<br>เริ่มต้นที่นี่</div>
  </div>

  <div class="login-side">
    <form class="login-box" id="form">
      <h1>เข้าสู่ระบบ</h1>
      <p class="lead" id="lead">เข้าสู่ระบบเพื่อสมัครเรียนหรือติดตามใบสมัคร</p>
      <div>
        <label for="email">อีเมล</label>
        <input type="email" id="email" value="somchai@example.com" autocomplete="email">
      </div>
      <div>
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" value="12345678" autocomplete="current-password">
      </div>
      <p class="help">ลืมรหัสผ่าน? ติดต่อ 037-217-300</p>
      <button class="btn btn-primary btn-lg btn-block" type="submit">เข้าสู่ระบบ</button>
      <p class="or">หรือ</p>
      <div class="oauth">
        <a href="#" data-go><img src="assets/icons/google.png" alt="">Google</a>
        <a href="#" data-go><img src="assets/icons/thaid.png" alt="">ThaiID</a>
      </div>
    </form>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/mock.js"></script>
<script>
  /* Where to go after signing in:
     - from "สมัครหลักสูตรนี้" (next=apply): profile step 1 the first time, otherwise round & documents
     - from a page that needed sign-in (next=page.html): back to that page
     - otherwise: first-time applicants fill the profile (Figma 04 → 05), returning ones see their applications */
  const next = qs("next");
  const code = qs("code");
  if(code && programByCode(code)) Store.saveDraft({ code: code.toUpperCase() });
  if(next === "apply") document.getElementById("lead").textContent =
    "เข้าสู่ระบบเพื่อสมัคร " + chosenProgram().code + " · ครั้งแรกจะให้กรอกข้อมูลผู้สมัครก่อน";

  function signInAs(email){
    Store.signIn(email);
    const done = Store.profile.done;
    let dest;
    if(next === "apply") dest = done ? "apply.html" : "profile-1.html";
    else if(next && /^[\w-]+\.html/.test(next)) dest = next;
    else dest = done ? "status.html" : "profile-1.html";
    location.href = dest;
  }
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    signInAs(document.getElementById("email").value.trim() || "somchai@example.com");
  });
  document.querySelectorAll("[data-go]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    signInAs(a.textContent.trim() === "Google" ? "somchai@gmail.com" : "somchai@thaid.go.th");
  }));
</script>
</body>
</html>
